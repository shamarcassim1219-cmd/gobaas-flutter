name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate missing Android platform files
        run: |
          mkdir -p /tmp/scaffold
          cd /tmp/scaffold
          flutter create --platforms=android --org com.gobaas --project-name mybaas .
          cp -rn /tmp/scaffold/android "$GITHUB_WORKSPACE/android"

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gobaas-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

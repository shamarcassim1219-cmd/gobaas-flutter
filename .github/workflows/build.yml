name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: mybaas-flutter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gobaas-debug-apk
          path: mybaas-flutter/build/app/outputs/flutter-apk/app-debug.apk

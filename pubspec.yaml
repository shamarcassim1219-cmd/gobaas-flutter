name: mybaas
description: MYBAAS - Hire trusted professionals near you.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.0

  # Secure token storage (encrypted, replaces localStorage)
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.2

  # Location (matches navigator.geolocation on web)
  geolocator: ^12.0.0

  # Image picking (NIC/verification photo, profile photo, complaint photos)
  image_picker: ^1.1.2

  # Base64 image handling helpers
  path_provider: ^2.1.3

  # Real-time notifications - Server-Sent Events client
  flutter_client_sse: ^2.0.1

  # Date formatting (order dates, notification timestamps)
  intl: ^0.19.0

  # Icons matching the web app's line-icon style
  cupertino_icons: ^1.0.6

  # Declarative, easy-to-chain animations (.fadeIn().slideY() etc) -
  # this is what makes screens feel smooth without hand-writing an
  # AnimationController for every single transition.
  flutter_animate: ^4.5.0

  # PayHere and PayPal both need an embedded checkout page - neither
  # has a pure-Dart SDK, so their web checkout flow is shown inside
  # an in-app webview instead of leaving the app.
  webview_flutter: ^4.9.0

  # Non-sensitive local settings (language choice, "seen onboarding"
  # flags) - kept separate from flutter_secure_storage, which is
  # reserved for the auth token.
  shared_preferences: ^2.3.2

  # Pull-to-refresh with a nicer built-in animation than the
  # platform default.
  liquid_pull_to_refresh: ^3.0.1

  # Skeleton loading placeholders (shimmer effect) instead of bare
  # spinners - reads as noticeably more polished while data loads.
  shimmer: ^3.0.0

  # Native share sheet - used for sharing a referral code/message
  # via whatever apps the user has installed (WhatsApp, SMS, etc).
  share_plus: ^11.0.0

  # Real push notifications (Firebase Cloud Messaging) - works even
  # when the app is closed/backgrounded, unlike the SSE/polling
  # fallback in NotificationService which only runs while the app
  # is open.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
